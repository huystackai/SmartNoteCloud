services:
  db:
    image: postgres:16-alpine
    container_name: minddeck-db
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minddecknote}
      POSTGRES_USER: ${POSTGRES_USER:-minddeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minddeck} -d ${POSTGRES_DB:-minddecknote}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minddeck-network

  backend:
    build:
      context: ./backend
    container_name: minddeck-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://minddeck:change_me_strong_password@db:5432/minddecknote}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_to_a_long_random_secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost,http://localhost:5173,http://127.0.0.1:5173,http://pkiresearch.id.vn,https://pkiresearch.id.vn}
      MIMO_API_URL: ${MIMO_API_URL:-}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      MIMO_MODEL: ${MIMO_MODEL:-mimo-chat}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-3}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - minddeck-network

  frontend:
    build:
      context: ./frontend
    container_name: minddeck-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - minddeck-network

  nginx:
    image: nginx:1.27-alpine
    container_name: minddeck-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - minddeck-network

volumes:
  postgres_data:

networks:
  minddeck-network:
    driver: bridge
