  <text x="154" y="646" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#475569">Ý nghĩa cloud: DB chạy gần backend để giảm độ trễ, đồng thời giảm rủi ro vì không public cổng PostgreSQL.</text>

