<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <text x="56" y="72" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="38" font-weight="700" fill="#0F172A">Bảo mật và vận hành khi chạy trên cloud</text>
  <text x="58" y="112" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#475569">Các cấu hình tối thiểu giúp demo cloud có thể truy cập công khai nhưng vẫn kiểm soát rủi ro.</text>

  <rect x="74" y="158" width="260" height="320" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
  <use data-icon="tabler-outline/shield-lock" x="110" y="198" width="42" height="42" fill="#2563EB" stroke-width="2"/>
  <text x="110" y="276" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="23" font-weight="700" fill="#0F172A">Network</text>
  <text x="110" y="318" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#475569">Security Group chỉ mở 80, 443 và SSH.</text>
  <text x="110" y="366" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#475569">PostgreSQL không public ra Internet.</text>
  <rect x="110" y="406" width="164" height="36" rx="12" fill="#2563EB" fill-opacity="0.08" stroke="#2563EB"/>
  <text x="132" y="429" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2563EB">22 / 80 / 443</text>

  <rect x="376" y="158" width="260" height="320" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
  <use data-icon="tabler-outline/certificate" x="412" y="198" width="42" height="42" fill="#00A676" stroke-width="2"/>
  <text x="412" y="276" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="23" font-weight="700" fill="#0F172A">HTTPS</text>
  <text x="412" y="318" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#475569">Let's Encrypt cấp chứng chỉ cho domain.</text>
  <text x="412" y="366" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#475569">HTTP redirect sang HTTPS qua Nginx.</text>
  <rect x="412" y="406" width="164" height="36" rx="12" fill="#00A676" fill-opacity="0.08" stroke="#00A676"/>
  <text x="434" y="429" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#00A676">HTTP/2 200</text>

  <rect x="678" y="158" width="260" height="320" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
  <use data-icon="tabler-outline/key" x="714" y="198" width="42" height="42" fill="#F59E0B" stroke-width="2"/>
  <text x="714" y="276" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="23" font-weight="700" fill="#0F172A">Secrets</text>
  <text x="714" y="318" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#475569">JWT secret, DB password và AI key nằm trong .env.</text>
  <text x="714" y="366" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#475569">Repo dùng .env.example để tránh lộ secret thật.</text>
  <rect x="714" y="406" width="164" height="36" rx="12" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B"/>
  <text x="736" y="429" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#F59E0B">.env.example</text>

  <rect x="980" y="158" width="226" height="320" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
  <use data-icon="tabler-outline/container" x="1016" y="198" width="42" height="42" fill="#0F172A" stroke-width="2"/>
  <text x="1016" y="276" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="23" font-weight="700" fill="#0F172A">Ops</text>
  <text x="1016" y="318" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#475569">Theo dõi docker ps, logs và health endpoint.</text>
  <text x="1016" y="366" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#475569">Certbot timer hỗ trợ gia hạn SSL.</text>
  <rect x="1016" y="406" width="144" height="36" rx="12" fill="#0F172A"/>
  <text x="1036" y="429" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#FFFFFF">/api/health</text>

  <rect x="88" y="528" width="1098" height="92" rx="24" fill="#0F172A"/>
  <text x="128" y="566" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Các điểm nên nâng cấp nếu đưa vào production</text>
  <text x="128" y="600" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#CBD5E1">Giới hạn SSH theo IP, dùng Secrets Manager, backup tự động, monitoring, WAF hoặc rate limit ở gateway.</text>

  <text x="56" y="690" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#94A3B8">14 · Security and Operations</text>
</svg>
