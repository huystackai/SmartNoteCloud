    <text x="628" y="558" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#475569">JWT + routers</text>
    <polygon points="852,512 886,526 852,540" fill="#CBD5E1"/>
    <rect x="922" y="500" width="104" height="38" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
