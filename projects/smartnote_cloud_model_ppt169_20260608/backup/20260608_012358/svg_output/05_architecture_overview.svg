<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <text x="56" y="70" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="38" font-weight="700" fill="#0F172A">Kiến trúc tổng thể: Nginx là entrypoint, database nằm private</text>
  <rect x="56" y="96" width="1168" height="50" rx="14" fill="#2563EB" fill-opacity="0.08"/>
  <text x="78" y="128" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" fill="#0F172A">Request từ Internet chỉ vào Nginx; frontend/backend/db giao tiếp trong Docker network, AI gọi ra SaaS API qua HTTPS.</text>
  <g id="public">
    <rect x="72" y="224" width="190" height="108" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <use data-icon="tabler-outline/browser" x="102" y="246" width="34" height="34" fill="#2563EB" stroke-width="2"/>
    <text x="148" y="270" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Browser</text>
    <text x="102" y="306" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#475569">pkiresearch.id.vn</text>
    <polygon points="288,268 326,284 288,300" fill="#CBD5E1"/>
  </g>
  <g id="ec2-zone">
    <rect x="340" y="174" width="574" height="340" rx="26" fill="#2563EB" fill-opacity="0.08" stroke="#2563EB" stroke-width="2"/>
    <text x="370" y="212" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#2563EB">AWS EC2 Instance (IaaS)</text>
    <rect x="392" y="250" width="174" height="104" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <use data-icon="tabler-outline/route" x="420" y="272" width="30" height="30" fill="#2563EB" stroke-width="2"/>
    <text x="462" y="294" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Nginx</text>
    <text x="420" y="326" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#475569">80/443 public</text>
    <polygon points="592,286 624,302 592,318" fill="#CBD5E1"/>
    <rect x="646" y="228" width="210" height="96" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="674" y="266" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">React Frontend</text>
    <text x="674" y="294" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#475569">static build</text>
    <rect x="646" y="366" width="210" height="96" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="674" y="404" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">FastAPI Backend</text>
    <text x="674" y="432" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#475569">JWT + business API</text>
    <polygon points="742,334 758,360 726,360" fill="#CBD5E1"/>
  </g>
  <g id="data">
    <rect x="960" y="232" width="218" height="106" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <use data-icon="tabler-outline/database" x="990" y="258" width="34" height="34" fill="#0F172A" stroke-width="2"/>
    <text x="1038" y="282" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">PostgreSQL</text>
    <text x="990" y="316" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#475569">private Docker network</text>
    <rect x="960" y="390" width="218" height="106" rx="18" fill="#00A676" fill-opacity="0.10" stroke="#00A676"/>
    <use data-icon="tabler-outline/api" x="990" y="416" width="34" height="34" fill="#00A676" stroke-width="2"/>
    <text x="1038" y="440" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Mimo AI API</text>
    <text x="990" y="474" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#475569">external SaaS/API</text>
    <line x1="856" y1="414" x2="960" y2="285" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="856" y1="414" x2="960" y2="443" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8"/>
  </g>
  <g id="legend">
    <rect x="130" y="566" width="1020" height="58" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="168" cy="595" r="8" fill="#2563EB"/><text x="186" y="601" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#475569">IaaS: EC2 + network + host runtime tự quản lý</text>
    <circle cx="550" cy="595" r="8" fill="#F59E0B"/><text x="568" y="601" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#475569">PaaS: hướng nâng cấp</text>
    <circle cx="790" cy="595" r="8" fill="#00A676"/><text x="808" y="601" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#475569">SaaS/API: AI provider</text>
  </g>
  <text x="56" y="690" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#94A3B8">05 · End-to-End Architecture</text>
</svg>
